spring:
  datasource:
    # 仅本地开发的默认值；共享/生产环境通过环境变量覆盖
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/dev_db}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: HavenHikariPool
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      # 只暴露健康、info，安全优先；不要写 *
      exposure:
        include: health,info
  endpoint:
    health:
      # always：所有人都能看到详情（开发、内网监控用）
      # 生产公网改成 when-authorized
      show-details: always
      show-components: ALWAYS
  info:
    env:
      enabled: true

# ---- Sa-Token ----
# 公共配置在 application.yaml；本地 http 开发不能要求 Secure Cookie，否则浏览器不回传
sa-token:
  cookie:
    secure: false

# ---- 业务配置 ----
haven:
  totp:
    issuer: Haven
  # 业务时区：留空取 JVM 时区。配置后热力图日界、月度汇总、YearMonth 都按该时区计算
  time-zone: ${HAVEN_TIME_ZONE:}
  upload-dir: uploads
  # 登录密码 / TOTP 动态码的失败尝试限制（防暴力破解）
  auth:
    login-max-attempts: 5
    login-window-minutes: 15
    totp-max-attempts: 5
