# 生产 profile：激活方式 SPRING_PROFILES_ACTIVE=prod
# 这里只放与环境相关的默认值，真实密钥一律走环境变量，不提交到仓库。
spring:
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      pool-name: HavenHikariPool
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# Sa-Token 公共配置在 application.yaml，这里保持 Cookie 安全属性开启
sa-token:
  is-log: false

management:
  endpoints:
    web:
      # 只暴露健康检查；生产不暴露 info/env
      exposure:
        include: health
  endpoint:
    health:
      # 不向匿名请求暴露组件详情
      show-details: never
      show-components: never
  info:
    env:
      enabled: false

# 反向代理 / 网关限制 /actuator/**（拦截器只覆盖 /api/**）
server:
  forward-headers-strategy: framework

haven:
  totp:
    issuer: ${HAVEN_TOTP_ISSUER:Haven}
  upload-dir: ${HAVEN_UPLOAD_DIR:uploads}
  auth:
    login-max-attempts: ${HAVEN_AUTH_LOGIN_MAX_ATTEMPTS:5}
    login-window-minutes: ${HAVEN_AUTH_LOGIN_WINDOW_MINUTES:15}
    totp-max-attempts: ${HAVEN_AUTH_TOTP_MAX_ATTEMPTS:5}

logging:
  file:
    path: ${LOG_PATH:./logs}
